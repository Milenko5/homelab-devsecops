name: Build, Audit (Syft/Grype) & Sign DevContainer Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de l'image Docker à publier"
        required: true
        default: "latest"
        type: string
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/build-devcontainer.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devcontainer
  SYFT_VERSION: "1.56.0"
  GRYPE_VERSION: "0.121.1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: "Build → Syft SBOM → Grype Gate (Fail-Fast) → Cosign Keyless"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source (Checkout)
        uses: actions/checkout@v7

      - name: 2. Initialisation de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Authentification auprès de GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Génération des métadonnées et des tags OCI
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'latest' }}
            type=sha,prefix=sha-

      - name: 5. Construction et publication de l'image Docker
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Installation et vérification SHA-256 des binaires Anchore Syft et Grype (Hard-Fail)
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.gz" 2>/dev/null || \
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "syft_${SYFT_VERSION}_checksums.txt"
          sudo tar -xzv -C /usr/local/bin syft -f "syft_${SYFT_VERSION}_linux_amd64.tar.gz"

          curl -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "grype_${GRYPE_VERSION}_checksums.txt"
          sudo tar -xzv -C /usr/local/bin grype -f "grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          rm -f *.tar.gz *_checksums.txt

      - name: 7. Génération de la nomenclature logicielle (SBOM SPDX) avec Syft
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${IMAGE_LOWER}@${{ steps.build-and-push.outputs.digest }}"
          syft "${IMAGE_URI}" -o spdx-json=devcontainer-sbom.spdx.json

      - name: 8. Barrière de sécurité CVE obligatoire avec Grype (Fail-Fast sur Critical)
        run: |
          # Coupe immédiatement le pipeline (exit 1) et empêche la signature Cosign si une CVE critique corrigée est détectée
          grype sbom:./devcontainer-sbom.spdx.json --only-fixed --fail-on critical

      - name: 9. Installation de Sigstore Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: 10. Signature cryptographique Keyless (OIDC) et Attestation SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${IMAGE_LOWER}@${{ steps.build-and-push.outputs.digest }}"

          echo "Signature cryptographique de l'image DevContainer via Fulcio & Rekor..."
          cosign sign --yes "${IMAGE_URI}"

          echo "Attachement de l'attestation SBOM Syft signée à l'image DevContainer..."
          cosign attest --yes --predicate devcontainer-sbom.spdx.json --type spdxjson "${IMAGE_URI}"
