name: CI - Validation Infrastructure & GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Principe du moindre privilège : lecture seule du code
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. DÉTECTION DE SECRETS (Empêche toute fuite accidentelle de clé ou token)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: "Sécurité : Scan de Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt avec historique
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Exécution de Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. VALIDATION OPENTOFU / TERRAFORM (Formatage, Chiffrement State & TFLint)
  # ---------------------------------------------------------------------------
  opentofu-check:
    name: "IaC : Validation OpenTofu (HCL) & TFLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      # Phrases secrètes factices uniquement pour la validation syntaxique CI
      TF_VAR_state_passphrase: "ci-validation-dummy-passphrase"
      TF_VAR_adguard_password: "ci-validation-dummy-password"
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Lecture des versions depuis .devcontainer/Dockerfile (Single Source of Truth)
        id: versions
        working-directory: .
        run: |
          echo "tofu=$(grep '^ARG OPENTOFU_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "tflint=$(grep '^ARG TFLINT_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Installation d'OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.versions.outputs.tofu }}

      - name: Vérification du formatage HCL (tofu fmt)
        run: tofu fmt -check -recursive

      - name: Initialisation sans backend distant
        run: tofu init -backend=false

      - name: Validation syntaxique et vérification du bloc encryption
        run: tofu validate

      - name: Installation et exécution de TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ steps.versions.outputs.tflint }}
      - name: Analyse TFLint
        run: |
          tflint --init
          tflint --recursive

  # ---------------------------------------------------------------------------
  # 3. VALIDATION ANSIBLE (Bonnes pratiques et idempotence des rôles)
  # ---------------------------------------------------------------------------
  ansible-check:
    name: "Config : Validation Ansible Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/ansible
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation d'Ansible et Ansible-Lint dans un environnement isolé
        run: |
          python3 -m venv /tmp/ansible-lint-venv
          /tmp/ansible-lint-venv/bin/pip install --upgrade pip ansible-core ansible-lint
          /tmp/ansible-lint-venv/bin/ansible-galaxy collection install ansible.posix community.general

      - name: Analyse de qualité avec Ansible-Lint (Hôtes & K3s)
        run: |
          export PATH="/tmp/ansible-lint-venv/bin:$PATH"
          ansible-lint playbook-hosts.yml playbook.yml

  # ---------------------------------------------------------------------------
  # 4. VALIDATION KUBERNETES, FLUXCD & AUDIT DE SÉCURITÉ CHECKOV
  # ---------------------------------------------------------------------------
  k8s-gitops-check:
    name: "GitOps : Schémas Kubernetes & Audit Checkov"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Kubeconform et Flux CLI
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=$(grep '^ARG KUBECONFORM_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)
          FLUX_VERSION=$(grep '^ARG FLUX_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)

          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          sha256sum -c --ignore-missing CHECKSUMS
          sudo tar -xzv -C /usr/local/bin kubeconform -f kubeconform-linux-amd64.tar.gz

          curl -fsSLO "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "flux_${FLUX_VERSION}_checksums.txt"
          sudo tar -xzv -C /usr/local/bin flux -f "flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          rm -f *.tar.gz CHECKSUMS *_checksums.txt

      - name: Téléchargement des schémas CRD de FluxCD (version épinglée)
        run: |
          set -euo pipefail
          FLUX_VERSION=$(grep '^ARG FLUX_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)
          mkdir -p /tmp/flux-crd-schemas/master-standalone-strict
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/crd-schemas.tar.gz" | tar zxf - -C /tmp/flux-crd-schemas/master-standalone-strict

      - name: Validation des manifestes YAML (hors secrets chiffrés SOPS)
        run: |
          find ./cluster -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name '*.sops.yaml' ! -name '*.sops.yml' -print0 | xargs -0 -r \
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location "/tmp/flux-crd-schemas/master-standalone-strict/{{.ResourceKind}}-{{.Group}}-{{.ResourceAPIVersion}}.json" \
              -verbose

      - name: Audit de sécurité statique IaC & Kubernetes avec Checkov
        run: |
          CHECKOV_VERSION=$(grep '^ARG CHECKOV_VERSION=' .devcontainer/Dockerfile | cut -d'"' -f2)
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov -d ./cluster -d ./infrastructure/terraform --framework kubernetes terraform --quiet --compact
