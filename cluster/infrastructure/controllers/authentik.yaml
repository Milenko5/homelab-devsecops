---
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
# Synchronisation des secrets Authentik (Secret Key, PostgreSQL & Bootstrap Admin Zero-ClickOps)
# depuis HashiCorp Vault via External Secrets Operator (ESO)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/config
        property: secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/config
        property: pg_password
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: authentik/config
        property: bootstrap_email
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik/config
        property: bootstrap_password
    - secretKey: password
      remoteRef:
        key: authentik/config
        property: pg_password
    - secretKey: postgres-password
      remoteRef:
        key: authentik/config
        property: pg_admin_password
---
# Blueprint Authentik déclaratif (100 % GitOps / Zéro-ClickOps) :
# Provisionne automatiquement le Proxy Provider (Forward Auth niveau domaine *.lab.sysdev.ca),
# l'Application Homelab Admin et l'attachement à l'Embedded Outpost au démarrage du worker
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-homelab-blueprint
  namespace: authentik
  labels:
    blueprints.goauthentik.io/instantiate: "true"
data:
  homelab-forward-auth.yaml: |
    version: 1
    metadata:
      name: "Homelab DevSecOps - Forward Auth Domain (*.lab.sysdev.ca)"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "homelab-domain-auth"
        attrs:
          name: "homelab-domain-auth"
          mode: "forward_domain"
          external_host: "https://auth.lab.sysdev.ca"
          cookie_domain: "lab.sysdev.ca"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: "homelab-admin"
        attrs:
          name: "Homelab Admin"
          slug: "homelab-admin"
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, "homelab-domain-auth"]]
          open_in_new_tab: false

      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: "authentik Embedded Outpost"
        attrs:
          name: "authentik Embedded Outpost"
          type: "proxy"
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, "homelab-domain-auth"]]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 30m0s
  timeout: 10m0s
  targetNamespace: authentik
  releaseName: authentik
  dependsOn:
    - name: external-secrets
  chart:
    spec:
      chart: authentik
      version: ">= 2025.2.0"
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
      interval: 12h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      envFrom:
        - secretRef:
            name: authentik-secrets
    blueprints:
      configMaps:
        - authentik-homelab-blueprint
    authentik:
      error_reporting:
        enabled: false
    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    serviceAccount:
      create: true
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-secrets
      primary:
        persistence:
          enabled: true
          storageClass: piraeus-storage-replicated
          accessModes:
            - ReadWriteOnce
          size: 4Gi
