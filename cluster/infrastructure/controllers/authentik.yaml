---
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
# Synchronisation des secrets Authentik (Secret Key & PostgreSQL) depuis HashiCorp Vault via ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/config
        property: secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/config
        property: pg_password
    - secretKey: password
      remoteRef:
        key: authentik/config
        property: pg_password
    - secretKey: postgres-password
      remoteRef:
        key: authentik/config
        property: pg_admin_password
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 30m0s
  timeout: 10m0s
  targetNamespace: authentik
  releaseName: authentik
  dependsOn:
    - name: external-secrets
  chart:
    spec:
      chart: authentik
      version: ">= 2025.2.0"
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
      interval: 12h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      envFrom:
        - secretRef:
            name: authentik-secrets
    authentik:
      error_reporting:
        enabled: false
    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    serviceAccount:
      create: true
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-secrets
      primary:
        persistence:
          enabled: true
          storageClass: piraeus-storage-replicated
          accessModes:
            - ReadWriteOnce
          size: 4Gi
