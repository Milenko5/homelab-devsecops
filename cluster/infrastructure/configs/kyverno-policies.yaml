---
# Politique Zero-Trust d'Admission CEL (Kyverno v1.20+ - ADR-0007) :
# Exige que toute image déployée dans le namespace 'demo-app' ait été signée sans clé (Keyless OIDC)
# par le workflow officiel GitHub Actions (supply-chain.yml) via Sigstore Fulcio & Rekor
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-signed-images-homelab
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo-app
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/milenko5/homelab-devsecops/*"
  attestors:
    - name: cosignkeyless
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/[Mm]ilenko5/homelab-devsecops/\\.github/workflows/supply-chain\\.yml@refs/heads/main$"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosignkeyless])).all(e, e > 0)
      message: "Signature OIDC Sigstore Cosign absente ou invalide : l'image doit être signée par le workflow officiel supply-chain.yml."
