apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "homelab-ip-pool"
spec:
  blocks:
    - start: "172.16.17.20"
      stop: "172.16.17.220"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "homelab-l2-announcement"
spec:
  interfaces:
    - "^eth0$"
  externalIPs: true
  loadBalancerIPs: true
