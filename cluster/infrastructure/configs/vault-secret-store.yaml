---
# ClusterSecretStore : Connecte External Secrets Operator (ESO) à HashiCorp Vault HA
# via l'authentification native Kubernetes (JWT ServiceAccount - Aucun jeton statique stocké)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
