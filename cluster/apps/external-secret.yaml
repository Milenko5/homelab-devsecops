---
# Synchronisation automatique d'un secret depuis HashiCorp Vault vers un Secret Kubernetes natif
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-db-secret
  namespace: demo-app
spec:
  refreshInterval: 15m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-app-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: demo-app/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: demo-app/database
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: demo-app/database
        property: db_host
